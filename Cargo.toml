[package]
name = "cetak-biru-berdarah"
version = "0.1.0"
edition = "2021"
description = "Cetak Biru Berdarah — The Crimson Blueprint: A 30-chapter analog detective adventure game"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
gloo-storage = "0.3"
gloo-timers = "0.3"
log = "0.4"
wasm-logger = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlInputElement",
    "KeyboardEvent",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
